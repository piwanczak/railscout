name: Refresh GTFS snapshot

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-gtfs
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.0
          cache: npm
      - name: Restore the conditional-download cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/gtfs
          key: gtfs-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            gtfs-${{ runner.os }}-
      - name: Install exact dependencies
        run: npm ci
      - name: Download and import a fresh feed when it changed
        # A restored archive can be newer than the committed snapshot after a failed run.
        run: npm run data:refresh -- --require-fresh --force-import
      - name: Verify source, build, tests, data, and licenses
        run: npm run check
      - name: Commit a changed generated snapshot
        shell: bash
        run: |
          if git diff --quiet -- app/data/ic-timetable.json app/data/provenance.json public/stations.json THIRD_PARTY_NOTICES.md; then
            echo "The upstream GTFS feed produced no repository changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/data/ic-timetable.json app/data/provenance.json public/stations.json THIRD_PARTY_NOTICES.md
          git commit -m "Refresh GTFS snapshot [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"
