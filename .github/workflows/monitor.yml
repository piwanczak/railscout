name: Check deployed timetable
on:
  schedule:
    - cron: "41 */6 * * *"
  workflow_dispatch:
permissions:
  contents: read
  actions: write
jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.18.0
      - name: Check deployed timetable
        id: health
        run: node scripts/check-deployment.mjs
      - name: Request a verified refresh after a failed health check
        if: failure() && steps.health.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh workflow run refresh-gtfs.yml --ref "${{ github.event.repository.default_branch }}"
          echo "Health check failed. Requested a GTFS refresh. The refresh must pass all checks before it can publish data. This monitor remains failed until a later check confirms recovery." >> "$GITHUB_STEP_SUMMARY"
